<!DOCTYPE html>
<html>
<head>
  <title>TestRail to Jira — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; width: 480px; }
    h2 { color: #0052CC; margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-top: 14px; margin-bottom: 4px; color: #333; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    .token-row { display: flex; gap: 8px; align-items: center; }
    .token-row input { flex: 1; }
    .fetch-token-btn { padding: 8px 12px; background: #0052CC; color: white; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .fetch-token-btn:hover { background: #0041A8; }
    .fetch-token-btn:disabled { background: #999; cursor: not-allowed; }
    button#save-btn { margin-top: 20px; padding: 10px 24px; background: #0052CC; color: white; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; }
    button#save-btn:hover { background: #0041A8; }
    #status { margin-top: 12px; font-weight: bold; display: none; }
    #status.success { color: #00875A; }
    #status.error { color: #DE350B; }
    .hint { font-size: 11px; color: #888; margin-top: 3px; }
    .auto-badge { display: inline-block; background: #E3FCEF; color: #00875A; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; margin-left: 6px; border: 1px solid #ABF5D1; }
  </style>
</head>
<body>
  <h2>TestRail to Jira Settings</h2>

  <label>TestRail Email</label>
  <input id="testrail_email" type="email" placeholder="you@amazon.com" />

  <label>TestRail API Key</label>
  <input id="testrail_api_key" type="password" placeholder="Your TestRail API key" />

  <label>TestRail URL</label>
  <input id="testrail_url" type="text" placeholder="https://testrail.p2r.amazon.dev" />

  <label>Jira URL</label>
  <input id="jira_url" type="text" placeholder="https://issues.labcollab.net" />

  <label>
    Jira Bearer Token
    <span class="auto-badge">Auto-refreshes every 6h</span>
  </label>
  <div class="token-row">
    <input id="jira_api_token" type="password" placeholder="Auto-fetched on startup, must be on VPN" />
    <button class="fetch-token-btn" id="get-token-btn">Force Refresh</button>
  </div>
  <div class="hint" id="token-hint">Auto-refreshes every 6h when on VPN. Click to force refresh immediately.</div>

  <button id="save-btn">Save Settings</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
